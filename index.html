<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Canales</title>
    <!-- Carga de librerías para HLS y DASH -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.6/shaka-player.compiled.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        video { width: 100%; max-height: 500px; background: #000; border-radius: 8px; }
        .channel-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }
        button { padding: 10px 15px; background: #1e293b; color: white; border: 1px solid #334155; border-radius: 5px; cursor: pointer; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>

<div class="container">
    <h1>Transmisión en Vivo</h1>
    <video id="videoPlayer" controls autoplay></video>

    <div class="channel-list">
        <button onclick="cargarHLS('https://d35j504z0x2vu2.cloudfront.net/v1/master/0bc8e8376bd8417a1b6761138aa41c26c7309312/bein-sports-xtra-en-espanol/playlist.m3u8')">Bein Sports Xtra</button>
        <button onclick="cargarHLS('https://d320m3arb2wo8b.cloudfront.net/out/v1/34e0da501a8c4489b713809eb08a9bf3/index_13.m3u8')">TyC Play</button>
        <button onclick="cargarDASH('https://edge-live13-sl.cvattv.com.ar/live/c3eds/CartoonNetwork/SA_Live_dash_enc/CartoonNetwork.mpd', '8abb2ee9150d8b2af8ebec0de0f833c8')">Cartoon Network</button>
    </div>
</div>

<script>
    const video = document.getElementById('videoPlayer');
    let shakaInstance = null;

    // Inicializar Shaka Player para streams DASH
    document.addEventListener('DOMContentLoaded', () => {
        shaka.polyfill.installAll();
        if (shaka.Player.isBrowserSupported()) {
            shakaInstance = new shaka.Player(video);
        }
    });

    // Función para cargar transmisiones HLS (.m3u8)
    function cargarHLS(url) {
        if (shakaInstance) shakaInstance.unload();

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
        }
    }

    // Función para cargar transmisiones DASH (.mpd) con clave ClearKey
    async function cargarDASH(url, keyHex) {
        if (!shakaInstance) return;

        await shakaInstance.unload();
        
        // Configuración de clave ClearKey en Shaka Player
        shakaInstance.configure({
            drm: {
                clearKeys: {
                    // ID por defecto o mapeo de clave ClearKey
                    '10000000000000000000000000000000': keyHex
                }
            }
        });

        try {
            await shakaInstance.load(url);
        } catch (e) {
            console.error('Error al cargar la transmisión DASH:', e);
        }
    }
</script>

</body>
</html>
